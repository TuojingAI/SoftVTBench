name: CI

on:
  push:
  pull_request:

jobs:
  public-contract:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install lightweight test dependencies
        run: python -m pip install numpy pytest 'tomli; python_version < "3.11"'
      - name: Unit tests
        run: python -m pytest tests SoftVTBench/tests -q
      - name: Static release audit
        run: python tools/release_audit.py --strict
