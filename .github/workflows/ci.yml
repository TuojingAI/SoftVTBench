name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout benchmark
        uses: actions/checkout@v4
        with:
          path: SoftVTBench
      - name: Checkout model companion
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/SoftVTBench-Models
          path: SoftVTBench-Models
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Audit source before installation
        run: |
          python -m pip install PyYAML numpy
          python SoftVTBench/tools/audit_repository.py --models-root SoftVTBench-Models
      - name: Run characterization tests
        run: |
          python -m pip install -e 'SoftVTBench[dev]'
          python -m unittest discover -s SoftVTBench/tests -v

